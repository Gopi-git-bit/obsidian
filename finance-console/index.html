<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zippy Finance</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Zippy Finance</h1>
        <p>Settlement queue, release readiness, accounting records, and audit trail</p>
      </div>
      <label class="api-base">API<input id="apiBase" value="http://127.0.0.1:8000" spellcheck="false"></label>
      <div class="login-panel">
        <input id="username" value="finance-console-dev" aria-label="Username" spellcheck="false">
        <select id="role" aria-label="Role">
          <option value="finance_admin">finance_admin</option>
          <option value="super_admin">super_admin</option>
          <option value="ops_admin">ops_admin</option>
        </select>
        <button id="login" type="button">Login</button>
        <span id="loginStatus">Not signed in</span>
      </div>
    </header>

    <main class="layout">
      <section class="panel">
        <div class="panel-title"><h2>Settlement Queue</h2><button id="refresh" type="button">Refresh</button></div>
        <div id="queueStatus" class="status-line">Loading settlements...</div>
        <div id="settlementList" class="list"></div>
      </section>

      <section class="panel detail-panel">
        <div id="emptyState" class="empty-state">Select a settlement item to review.</div>
        <div id="settlementDetail" class="hidden">
          <div class="detail-header">
            <div>
              <h2 id="detailTitle">Settlement</h2>
              <p id="detailSub"></p>
            </div>
            <span id="releaseBadge" class="badge"></span>
          </div>
          <div id="blocker" class="blocker hidden"></div>
          <div class="actions">
            <button id="releaseSettlement" type="button">Release Settlement</button>
          </div>
          <section><h3>Readiness</h3><div id="readiness" class="metric-grid"></div></section>
          <section><h3>Journal / GST</h3><div id="accounting" class="metric-grid"></div></section>
          <section><h3>Records</h3><div id="records" class="record-grid"></div></section>
          <section><h3>Audit Trail</h3><div id="auditTrail" class="audit-list"></div></section>
          <section><h3>Recent Events</h3><div id="outboxEvents" class="audit-list"></div></section>
        </div>
      </section>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
