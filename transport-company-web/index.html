<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zippy Transport Company</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Zippy Transport Company</h1>
        <p>Company vehicles, match requests, and owned trip status</p>
      </div>
      <label class="api-base">API<input id="apiBase" value="http://127.0.0.1:8000" spellcheck="false"></label>
      <div class="login-panel">
        <input id="username" value="transport-company-web-dev" aria-label="Username" spellcheck="false">
        <button id="login" type="button">Login</button>
        <span id="loginStatus">Not signed in</span>
      </div>
    </header>

    <main class="layout">
      <section class="panel">
        <div class="panel-title"><h2>Vehicles</h2><button id="addVehicle" type="button">Add Vehicle</button></div>
        <div id="vehicleStatus" class="status-line">Loading vehicles...</div>
        <div id="vehicleList" class="list"></div>
      </section>

      <section class="panel">
        <div class="panel-title"><h2>Matches</h2><button id="refresh" type="button">Refresh</button></div>
        <div id="matchStatus" class="status-line">Loading matches...</div>
        <div id="matchList" class="list"></div>
      </section>

      <section class="panel detail-panel">
        <div id="emptyState" class="empty-state">Select a match or trip.</div>
        <div id="detail" class="hidden">
          <div class="detail-header">
            <div><h2 id="detailTitle">Detail</h2><p id="detailSub"></p></div>
            <span id="detailBadge" class="badge"></span>
          </div>
          <div id="actions" class="actions">
            <button id="acceptMatch" type="button">Accept Match</button>
            <button id="rejectMatch" type="button">Reject Match</button>
          </div>
          <section><h3>Company-Safe Records</h3><div id="records" class="record-grid"></div></section>
        </div>
      </section>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
