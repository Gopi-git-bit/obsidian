<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zippy Driver</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Zippy Driver</h1>
        <p>Assigned trips, proof uploads, POD, and milestones</p>
      </div>
      <label class="api-base">
        API
        <input id="apiBase" value="http://127.0.0.1:8000" spellcheck="false">
      </label>
      <div class="login-panel">
        <input id="username" value="driver-web-dev" aria-label="Username" spellcheck="false">
        <button id="login" type="button">Login</button>
        <span id="loginStatus">Not signed in</span>
      </div>
    </header>

    <main class="layout">
      <section class="trips-panel">
        <div class="panel-title">
          <h2>My Trips</h2>
          <button id="refreshTrips" type="button">Refresh</button>
        </div>
        <div id="tripsStatus" class="status-line">Loading trips...</div>
        <div id="tripsList" class="trips-list"></div>
      </section>

      <section class="detail-panel">
        <div id="emptyState" class="empty-state">Select an assigned trip.</div>
        <div id="tripDetail" class="hidden">
          <div class="detail-header">
            <div>
              <h2 id="detailTitle">Trip</h2>
              <p id="detailRoute"></p>
            </div>
            <span id="tripBadge" class="badge"></span>
          </div>

          <div id="actions" class="actions">
            <button id="ackTrip" type="button">Acknowledge</button>
            <button id="addMilestone" type="button">Add Milestone</button>
            <button id="uploadLoading" type="button">Upload Loading Proof</button>
            <button id="uploadPod" type="button">Upload POD</button>
          </div>

          <section>
            <h3>Driver-Safe Trip Detail</h3>
            <div id="recordSections" class="record-grid"></div>
          </section>
        </div>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
