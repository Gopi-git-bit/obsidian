# DeepSeek Harness — Permission Matrix
#
# Format:
#   - agentRole: <role>
#     capability: <capability>
#     effect: allow | deny
#     conditions: {}  # optional runtime checks

permissions:
  # Logistics Operations Agent
  - agentRole: logistics-ops
    capability: llm.generate
    effect: allow
  - agentRole: logistics-ops
    capability: audit.log
    effect: allow
  - agentRole: logistics-ops
    capability: audit.lock
    effect: allow
  - agentRole: logistics-ops
    capability: erp.read
    effect: allow
  - agentRole: logistics-ops
    capability: erp.write
    effect: allow
  - agentRole: logistics-ops
    capability: composio.invoke
    effect: allow

  # Marketing / Sales / Accounting Agents
  - agentRole: marketing-ops
    capability: llm.generate
    effect: allow
  - agentRole: marketing-ops
    capability: audit.log
    effect: allow
  - agentRole: marketing-ops
    capability: erp.read
    effect: allow
  - agentRole: marketing-ops
    capability: erp.write
    effect: allow

  - agentRole: sales-ops
    capability: llm.generate
    effect: allow
  - agentRole: sales-ops
    capability: audit.log
    effect: allow
  - agentRole: sales-ops
    capability: erp.read
    effect: allow
  - agentRole: sales-ops
    capability: erp.write
    effect: allow

  - agentRole: accounting-ops
    capability: llm.generate
    effect: allow
  - agentRole: accounting-ops
    capability: audit.log
    effect: allow
  - agentRole: accounting-ops
    capability: audit.lock
    effect: allow
  - agentRole: accounting-ops
    capability: erp.read
    effect: allow
  - agentRole: accounting-ops
    capability: erp.write
    effect: allow

  # Business Intelligence Agents
  - agentRole: bi-research
    capability: llm.generate
    effect: allow
  - agentRole: bi-research
    capability: tinyfish.search
    effect: allow
  - agentRole: bi-research
    capability: n8n.trigger
    effect: allow
  - agentRole: bi-research
    capability: audit.log
    effect: allow

  - agentRole: bi-analyst
    capability: llm.generate
    effect: allow
  - agentRole: bi-analyst
    capability: n8n.trigger
    effect: allow
  - agentRole: bi-analyst
    capability: erp.read
    effect: allow
  - agentRole: bi-analyst
    capability: erp.comment
    effect: allow
  - agentRole: bi-analyst
    capability: audit.log
    effect: allow

  # Platform Admin: full access, but still logged
  - agentRole: platform-admin
    capability: llm.generate
    effect: allow
  - agentRole: platform-admin
    capability: audit.log
    effect: allow
  - agentRole: platform-admin
    capability: audit.lock
    effect: allow
  - agentRole: platform-admin
    capability: erp.read
    effect: allow
  - agentRole: platform-admin
    capability: erp.write
    effect: allow
  - agentRole: platform-admin
    capability: erp.comment
    effect: allow
  - agentRole: platform-admin
    capability: composio.invoke
    effect: allow

  # Deny rules (explicit overrides)
  - agentRole: bi-research
    capability: erp.write
    effect: deny
  - agentRole: bi-analyst
    capability: erp.write
    effect: deny
  - agentRole: marketing-ops
    capability: audit.lock
    effect: deny
  - agentRole: sales-ops
    capability: audit.lock
    effect: deny
